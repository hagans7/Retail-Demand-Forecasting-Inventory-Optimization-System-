[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-decision-platform"
version = "1.0.0"
requires-python = ">=3.11.9,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.13.3",
    "lightgbm==4.6.0",
    "numpy>=1.26.4,<2.0",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "shap==0.45.1",
    "statsmodels==0.14.6",
    "scipy==1.13.1",
    "joblib==1.4.2",
    "minio==7.2.9",
    "redis==5.1.1",
    "celery==5.4.0",
    "celery[redis]==5.4.0",
    "kombu==5.3.7",
    "flower==2.0.1",
    "httpx==0.27.2",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.1",
    "httpx==0.27.2",
]
prod = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*"]
